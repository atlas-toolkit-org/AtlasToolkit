# Every pull request runs this, and it always ends in one check, `ci-ok`, which the `main` ruleset requires (with DCO).
# - Code changes: lint plus the Linux and Windows suites.
# - Changes to Markdown and LICENSE only: lint plus the documentation tests (`docs`, about two minutes).
# - The label `full-ci` (once per milestone before merging) or a manual run: macOS and the oldest supported Python too.
# The native helpers' build comes from a cache that cache.yml keeps warm on `main`. Test locally first.
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && 'full' || 'base' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  ATLAS_TEST_REQUIRE_HELPERS: "1"

jobs:
  # Does this pull request touch anything besides Markdown and LICENSE? A manual run always counts as code.
  changes:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2           # the pull request's merge commit and its first parent, the base branch
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$files"
          if printf '%s' "$files" | grep -qvE '\.md$|^LICENSE$'; then code=true; else code=false; fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  lint:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The lock matches pyproject.toml
        run: uv lock --check
      - name: Ruff
        run: uv run --locked --only-group dev ruff check .

  # Markdown-only pull requests: the tests that read the documents (links, images, anchors, licence lines, paths).
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Documentation tests
        working-directory: tests
        env:
          QT_QPA_PLATFORM: offscreen
          ATLAS_TEST_REQUIRE_HELPERS: "0"     # this job builds no helpers
        run: ../.venv/bin/python -m unittest test_readme test_licence test_portability

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/private-presets
        with:
          key: ${{ secrets.PRESETS_DEPLOY_KEY }}
          repository: ${{ vars.PRESETS_REPOSITORY }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build xvfb libegl1 libgl1 libopengl0 libgl1-mesa-dri libxkbcommon0 \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libglib2.0-0t64 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-image0 libxcb-render-util0 libxcb-randr0
      - run: uv sync --locked --all-extras
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/_deps
            native/build
          key: native-${{ runner.os }}-${{ hashFiles('native/**') }}
          restore-keys: native-${{ runner.os }}-
      - name: Native helpers
        run: .venv/bin/python native/build.py
      - name: The helpers' notices come out the same on every OS
        run: git diff --exit-code -- src/atlas_toolkit/licenses
      - name: Tests, on the real X11 plugin with software OpenGL
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
          HOME: ${{ runner.temp }}/untouched-home
        run: |
          mkdir -p "$HOME"
          xvfb-run -a -s "-screen 0 1600x1000x24" .venv/bin/python scripts/dev/run_tests.py
          echo "The real home stayed empty:"
          test -z "$(ls -A "$HOME")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tests-linux
          path: build/qa/tests
          retention-days: 3

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/private-presets
        with:
          key: ${{ secrets.PRESETS_DEPLOY_KEY }}
          repository: ${{ vars.PRESETS_REPOSITORY }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --all-extras
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/_deps
            native/build
          key: native-${{ runner.os }}-${{ hashFiles('native/**') }}
          restore-keys: native-${{ runner.os }}-
      - name: Native helpers
        run: .venv\Scripts\python native\build.py
      - name: The helpers' notices come out the same on every OS
        run: git diff --exit-code -- src/atlas_toolkit/licenses
      - name: Tests
        run: .venv\Scripts\python scripts\dev\run_tests.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tests-windows
          path: build/qa/tests
          retention-days: 3

  macos:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-ci'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/private-presets
        with:
          key: ${{ secrets.PRESETS_DEPLOY_KEY }}
          repository: ${{ vars.PRESETS_REPOSITORY }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: brew install ninja
      - run: uv sync --locked --all-extras
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/_deps
            native/build
          key: native-${{ runner.os }}-${{ hashFiles('native/**') }}
          restore-keys: native-${{ runner.os }}-
      - name: Native helpers
        run: .venv/bin/python native/build.py
      - name: The helpers' notices come out the same on every OS
        run: git diff --exit-code -- src/atlas_toolkit/licenses
      - name: Tests, on the real Cocoa plugin
        env:
          QT_QPA_PLATFORM: cocoa
        run: .venv/bin/python scripts/dev/run_tests.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tests-macos
          path: build/qa/tests
          retention-days: 3

  oldest-python:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/private-presets
        with:
          key: ${{ secrets.PRESETS_DEPLOY_KEY }}
          repository: ${{ vars.PRESETS_REPOSITORY }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build xvfb libegl1 libgl1 libopengl0 libgl1-mesa-dri libxkbcommon0 \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libglib2.0-0t64 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-image0 libxcb-render-util0 libxcb-randr0
      - run: uv sync --locked --all-extras --python 3.12
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/_deps
            native/build
          key: native-${{ runner.os }}-${{ hashFiles('native/**') }}
          restore-keys: native-${{ runner.os }}-
      - name: Native helpers
        run: .venv/bin/python native/build.py
      - name: The helpers' notices come out the same on every OS
        run: git diff --exit-code -- src/atlas_toolkit/licenses
      - name: Tests on Python 3.12
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1600x1000x24" .venv/bin/python scripts/dev/run_tests.py

  # The one check the ruleset requires: every job above passed or was skipped on purpose.
  ci-ok:
    if: always()
    needs: [changes, lint, docs, linux, windows, macos, oldest-python]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "A job ended with: $r"; exit 1 ;; esac
          done
