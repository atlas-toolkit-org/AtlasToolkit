# Coverage is complete and the triggers are rationed, so runs stay short and the queue free: Linux and Windows run on
# pull requests. macOS and the oldest supported Python run when the label
# `full-ci` is added, once per milestone before merging, or by hand. Test locally first (Windows, then Linux in WSL).
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && 'full' || 'base' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  ATLAS_TEST_REQUIRE_HELPERS: "1"

jobs:
  lint:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The lock matches pyproject.toml
        run: uv lock --check
      - name: Ruff
        run: uv run --locked --only-group dev ruff check .

  linux:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/private-presets
        with:
          key: ${{ secrets.PRESETS_DEPLOY_KEY }}
          repository: ${{ vars.PRESETS_REPOSITORY }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build xvfb libegl1 libgl1 libopengl0 libgl1-mesa-dri libxkbcommon0 \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libglib2.0-0t64 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-image0 libxcb-render-util0 libxcb-randr0
      - run: uv sync --locked --all-extras
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/_deps
            native/build
          key: native-${{ runner.os }}-${{ hashFiles('native/**') }}
          restore-keys: native-${{ runner.os }}-
      - name: Native helpers
        run: .venv/bin/python native/build.py
      - name: The helpers' notices come out the same on every OS
        run: git diff --exit-code -- src/atlas_toolkit/licenses
      - name: Tests, on the real X11 plugin with software OpenGL
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
          HOME: ${{ runner.temp }}/untouched-home
        run: |
          mkdir -p "$HOME"
          xvfb-run -a -s "-screen 0 1600x1000x24" .venv/bin/python scripts/dev/run_tests.py
          echo "The real home stayed empty:"
          test -z "$(ls -A "$HOME")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tests-linux
          path: build/qa/tests
          retention-days: 3

  windows:
    if: github.event.action != 'labeled'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/private-presets
        with:
          key: ${{ secrets.PRESETS_DEPLOY_KEY }}
          repository: ${{ vars.PRESETS_REPOSITORY }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --all-extras
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/_deps
            native/build
          key: native-${{ runner.os }}-${{ hashFiles('native/**') }}
          restore-keys: native-${{ runner.os }}-
      - name: Native helpers
        run: .venv\Scripts\python native\build.py
      - name: The helpers' notices come out the same on every OS
        run: git diff --exit-code -- src/atlas_toolkit/licenses
      - name: Tests
        run: .venv\Scripts\python scripts\dev\run_tests.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tests-windows
          path: build/qa/tests
          retention-days: 3

  macos:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-ci'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/private-presets
        with:
          key: ${{ secrets.PRESETS_DEPLOY_KEY }}
          repository: ${{ vars.PRESETS_REPOSITORY }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: brew install ninja
      - run: uv sync --locked --all-extras
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/_deps
            native/build
          key: native-${{ runner.os }}-${{ hashFiles('native/**') }}
          restore-keys: native-${{ runner.os }}-
      - name: Native helpers
        run: .venv/bin/python native/build.py
      - name: The helpers' notices come out the same on every OS
        run: git diff --exit-code -- src/atlas_toolkit/licenses
      - name: Tests, on the real Cocoa plugin
        env:
          QT_QPA_PLATFORM: cocoa
        run: .venv/bin/python scripts/dev/run_tests.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tests-macos
          path: build/qa/tests
          retention-days: 3

  oldest-python:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/private-presets
        with:
          key: ${{ secrets.PRESETS_DEPLOY_KEY }}
          repository: ${{ vars.PRESETS_REPOSITORY }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build xvfb libegl1 libgl1 libopengl0 libgl1-mesa-dri libxkbcommon0 \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libglib2.0-0t64 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-image0 libxcb-render-util0 libxcb-randr0
      - run: uv sync --locked --all-extras --python 3.12
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/_deps
            native/build
          key: native-${{ runner.os }}-${{ hashFiles('native/**') }}
          restore-keys: native-${{ runner.os }}-
      - name: Native helpers
        run: .venv/bin/python native/build.py
      - name: The helpers' notices come out the same on every OS
        run: git diff --exit-code -- src/atlas_toolkit/licenses
      - name: Tests on Python 3.12
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1600x1000x24" .venv/bin/python scripts/dev/run_tests.py
