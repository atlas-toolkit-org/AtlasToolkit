# A draft GitHub release with every installer, made when a version tag is pushed. See docs/PACKAGING.md.
#
#   git tag v2.0.0 && git push origin v2.0.0
#
# It publishes nothing: a person reads the draft and clicks Publish. It runs the same freeze, gates and install tests as the
# label `full-ci`, and takes as long as they do, so the first job stops a mistyped tag before any of that starts.
name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag names this version, the version has its changelog entry, and the commit is on main
        run: |
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > /dev/null
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write          # only this job can write, and only ever a draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Every installer is here, or there is no draft
        run: |
          version=${GITHUB_REF_NAME#v}
          for name in "AtlasToolkit-$version-windows-x64-setup.exe" "atlas-toolkit_${version}_amd64.deb" \
                      "atlas-toolkit-$version-1.x86_64.rpm" "AtlasToolkit-$version-linux-x86_64.AppImage" \
                      "AtlasToolkit-$version-macos-arm64.dmg"; do
            test -f "installers/$name" || { echo "missing: $name"; exit 1; }
          done
          (cd installers && sha256sum -- * > SHA256SUMS.txt)
      - name: The draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" installers/* --draft --verify-tag \
            --title "Atlas Toolkit ${GITHUB_REF_NAME#v}" --notes-file notes.md
