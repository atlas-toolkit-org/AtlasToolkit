# The model catalogue's contents (core/catalogue.py), built by scripts/catalogue.py; see docs/CATALOGUE.md.
#
# One [[model]] block per model. Sources:
#   commons = "File name.stl"     a Wikimedia Commons file; its licence is read from Commons and must equal `license`
#   url = ... + source_url + license_evidence      anything else; quote the source's licence words
#   generator = "name" (+ params)  made in code (geom/shapes.py) at build time, then shipped or downloaded like a scan
# Licences allowed: CC0-1.0, CC-BY-4.0, CC-BY-SA-4.0, LicenseRef-public-domain (marked public domain at the source).
# What suits Atlas: solid, readable forms. No scale bars, labels or stands in the scan; nothing mostly thin (wires,
# skeletons, fine branches, hollow vessels: `check` measures it); no clutter of hundreds of loose pieces.
# Never NC (non-commercial), ND (no derivatives) or CC-BY-SA 3.0: the app is GPL-3.0 and may be sold.
#
# Preparing: up/front name the source's axes (default: guessed as the tools do), rotate turns it further (degrees,
# X then Y then Z), crop keeps a share of the bounding box along an axis (after turning: z is up, -y the front),
# triangles is the most it keeps (quadric decimation), keep = "largest" drops every other piece, subdivide = "flat" or
# "smooth" refines a light model up to `triangles`. bundled = true ships it inside the app (keep that set under 40 MB).
# view = {azimuth, elevation} turns the thumbnail's camera.
# from = "<id>" makes a lighter copy of another model: same source, licence, credits, turns and crop; give its own id,
# name, category and triangles (Light & quick holds them: every tool runs on them in seconds).

[catalogue]
revision = 1
base_url = "https://github.com/atlas-toolkit-org/AtlasToolkit/releases/download/catalogue-1/"
# Shapes & forms: these simple solids ship in the app (bundled = true); the more complex shapes download
simple_shapes = ["sphere", "cube", "tetrahedron", "octahedron", "dodecahedron", "icosahedron", "pyramid", "cylinder",
                 "cone", "capsule", "torus", "rounded-cube"]

[[category]]
id = "light"
name = "Light & quick"
icon = "cat_light"
blurb = "Heads, busts and statues of 5,000 to 50,000 triangles, all in the app: every tool runs on them in seconds."

[[category]]
id = "people"
name = "Natural heads"
icon = "cat_head"
blurb = "Realistic heads and busts: a sculpted head, forensic facial reconstructions and portraits from life."

[[category]]
id = "busts"
name = "Busts & heads"
icon = "cat_bust"
blurb = "Portrait heads and busts, from Egypt to Rodin: faces are what contour lines and hatching love most."

[[category]]
id = "statues"
name = "Statues & figures"
icon = "cat_statue"
blurb = "Full figures standing, striding, throwing, thinking: classical casts and modern masters."

[[category]]
id = "animals"
name = "Animals"
icon = "cat_animal"
blurb = "Creatures whole: graphics-research classics, sculptures and scanned specimens."

[[category]]
id = "hands"
name = "Hands, faces & masks"
icon = "cat_hand"
blurb = "Life masks, hand casts and masks: shallow, detailed surfaces that read well as drawings."

[[category]]
id = "nature"
name = "Natural history"
icon = "cat_shell"
blurb = "Skulls, skeletons, fossils, shells and corals from museum collections."

[[category]]
id = "objects"
name = "Objects & test classics"
icon = "cat_teapot"
blurb = "Vessels, machines and the test models of computer graphics."

[[category]]
id = "shapes"
name = "Shapes & forms"
icon = "cat_shapes"
blurb = "Generated in the app: from the cube to knots, one-sided surfaces, minimal surfaces and fractals."

